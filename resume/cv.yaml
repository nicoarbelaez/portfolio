cv:
  name: 'Nicolas Arbelaez Tapias'
  headline: 'AI-First Software Engineer | Full Stack | AI Engineering'
  location: 'Cali, Colombia'
  email: 'arbelaeznicolas636@gmail.com'
  phone: '+573226784229'
  website: 'https://arbelaeznicolas.dev/'
  social_networks:
    - network: 'LinkedIn'
      username: 'arbelaeznicolas'
    - network: 'GitHub'
      username: 'nicoarbelaez'
  custom_connections:
    - placeholder: platzi.com/p/arbelaeznicolas636
      url: https://platzi.com/p/arbelaeznicolas636/
      fontawesome_icon: link
  sections:
    perfil:
      - |
        AI-First Software Engineer y desarrollador Full Stack. Orquesto agentes de código con IA (Claude Code, Cursor Agent, Codex, Gemini CLI) para diseñar, implementar, probar y llevar funcionalidades a producción: alrededor del 80-90 % de mi código se genera con agentes bajo mi dirección, con revisión de cada cambio y pruebas automatizadas. Stack principal en TypeScript, React/Next.js y Node.js/NestJS, con AWS Lambda y bases en Java/Spring Boot. Construyo agentes de IA en producción (LLMs, orquestación de herramientas, memoria) y procesamiento inteligente de documentos con OCR, y trabajo con autonomía frente a requerimientos ambiguos.
    experiencia_laboral:
      - company: 'Danys Tortas'
        summary: 'Proyecto - Freelancer (hoy soporte y evolución) | [danystortas.com](https://danystortas.com)'
        position: 'Desarrollador Full Stack – Agentes de IA'
        location: 'Colombia'
        start_date: '2026-01'
        end_date: 'present'
        highlights:
          - 'Diseñé y opero un agente de IA de ventas y soporte por WhatsApp (Kommo CRM) que atiende a más de 300 clientes diarios: catálogo semántico, pedidos, pagos, domicilios y escalamiento a humano.'
          - 'Construí un pipeline LLM propio de ocho etapas (clasificación de intents, ruteo de modelos por costo vía OpenRouter, loop de herramientas con circuit breakers y RAG), tras migrar desde LangGraph.'
          - 'Implementé guardrails deterministas que bloquean montos o datos de pago no provenientes de herramientas, con telemetría de costo.'
          - 'Integré el agente con un ERP multi-sucursal (inventario, caja, despachos, RBAC de seis roles) y un módulo de procesamiento de documentos con OCR y confianza por campo.'
          - 'Desarrollado con flujo AI-first (Claude Code, Cursor) y revisión propia de cada cambio: más de 1.400 archivos de pruebas y CI/CD en GitHub Actions con despliegue automatizado en Dokploy.'

      - company: 'Trainer Elitez'
        summary: 'Proyecto - Freelancer'
        position: 'Desarrollador de Software y Automatización'
        location: 'Colombia'
        start_date: '2024'
        end_date: '2026'
        highlights:
          - 'Automaticé el cálculo de macros y rutinas de entrenamiento
            personalizadas, eliminando errores manuales críticos del negocio.'
          - 'Centralicé la gestión de clientes en una app móvil propia que
            reemplazó hojas de cálculo dispersas.'
          - 'Tecnologías: Google Apps Script, Google AppSheet, TypeScript.'

      - company: 'Banco Davivienda'
        position: 'Aprendiz – Programa Nativos Semillero'
        location: 'Colombia'
        start_date: '2025-03'
        end_date: '2026-03'
        highlights:
          - 'Automaticé procesos de back office con Google Apps Script,
            reduciendo tareas operativas manuales del equipo.'
          - 'Desarrollé tableros de visualización para indicadores de captación
            bancaria consumidos por el área de negocio.'

    proyectos:
      - name: 'Mecateo'
        summary: 'SaaS propio | [mecateo.co](https://mecateo.co)'
        start_date: '2026-05'
        end_date: 'present'
        highlights:
          - 'Construyo con un equipo pequeño un SaaS multi-tenant para negocios
            físicos: soportes NFC/QR con destinos editables, captación de
            contactos y analítica de taps.'
          - 'Diseñé un monorepo Turborepo (12 apps, 10 paquetes) con NestJS,
            Next.js, Prisma sobre PostgreSQL, Better Auth y Socket.IO.'
          - 'Automaticé CI/CD con GitHub Actions: staging, backup y migración
            previos al despliegue en Dokploy, y más de 600 archivos de pruebas.'

      - name: 'Smart Work Core'
        summary: '[swc.mecateo.co](https://swc.mecateo.co)'
        date: '2026-10'
        highlights:
          - 'Desarrollé una plataforma de inteligencia empresarial que
            consolida fuentes públicas de Colombia (SECOP II, datos.gov.co,
            Banco Mundial, XM) en señales, alertas y briefings para la toma
            de decisiones.'
          - 'Integré un asistente de IA con Vercel AI SDK (OpenAI/OpenRouter)
            que responde sobre los datos cargados citando fuentes, con búsqueda
            web opcional.'
          - 'Apliqué arquitectura por capas, pruebas con Vitest y Playwright, CI
            en GitHub Actions y acceso restringido con Cloudflare Access.'

      - name: 'Living Sports'
        summary: '[github.com/nicoarbelaez/living-sports-app](https://github.com/nicoarbelaez/living-sports-app)'
        date: 2025
        highlights:
          - 'Desarrollé red social fitness móvil (Expo/React Native) con feed,
            perfiles y publicaciones multimedia, entregada en producción.'
          - 'Integré Supabase para auth, base de datos y storage en tiempo
            real; Cloudinary para optimización y entrega de imágenes.'

      - name: 'ReadIA'
        summary: '[readia.arbelaeznicolas.dev](https://readia.arbelaeznicolas.dev)'
        date: 2025
        highlights:
          - 'Construí plataforma serverless con IA para diagnóstico de
            capacidades TI con Google Gemini sobre arquitectura sin servidor.'
          - 'Integré Supabase como capa de persistencia y AWS Lambda
            para lógica de backend desacoplada, desplegada en Vercel.'

    habilidades_tecnicas:
      - bullet: 'Backend: TypeScript, Node.js, NestJS, Python, Java (Spring Boot),
          PHP.'
      - bullet: 'Frontend: Next.js (React), Astro, Tailwind CSS, TypeScript, React
          Native (Expo).'
      - bullet: 'BD & Infra: PostgreSQL (pgvector), Supabase, Redis, Vercel, AWS
          Lambda, Cloudflare.'
      - bullet: 'AI-First Development: Claude Code, Cursor Agent, GitHub Copilot/Codex,
          Gemini CLI; desarrollo guiado por especificaciones y revisión de código generado por IA.'
      - bullet: 'IA & Automatización: Arquitecturas agentic, integración de LLMs
          (OpenRouter/Gemini/OpenAI), procesamiento inteligente de documentos
          (OCR con modelos de visión), n8n, Google Apps Script.'
      - bullet: 'Calidad & DevOps: Vitest/Jest, Playwright/Cypress, GitHub Actions (CI/CD),
          Git flow con pull requests, TypeScript estricto, ESLint, Docker, Dokploy.'
    certificados:
      - bullet: 'Platzi (Ago 2025) | [Curso de Automatizaciones con
          n8n](https://platzi.com/p/arbelaeznicolas636/curso/12245-n8n-lowcode/diploma/detalle/)'
      - bullet: 'Platzi (Abr 2025) | [Curso de Backend con Node.js: Autenticación con
          Passport.js y
          JWT](https://platzi.com/p/arbelaeznicolas636/curso/2489-passport/diploma/detalle/)'
      - bullet: 'Platzi (Mar 2025) | [Curso de Backend con Node.js: Base de Datos con
          PostgreSQL](https://platzi.com/p/arbelaeznicolas636/curso/2507-backend-nodejs-postgres/diploma/detalle/)'
      - bullet: 'Platzi (Mar 2025) | [Curso de Backend con Node.js: API REST con
          Express.js](https://platzi.com/p/arbelaeznicolas636/curso/2485-backend-nodejs/diploma/detalle/)'
      - bullet: 'Platzi (Nov 2024) | [Curso de Java Spring Security: Autenticación y
          Seguridad
          Web](https://platzi.com/p/arbelaeznicolas636/curso/7694-java-spring-security/diploma/detalle/)'
    educacion:
      - institution: 'Universidad Santiago de Cali'
        area: 'Ingeniería en Sistemas'
