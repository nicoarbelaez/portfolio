cv:
  name: 'Nicolas Arbelaez Tapias'
  location: 'Cali, Colombia'
  email: 'arbelaeznicolas636@gmail.com'
  phone: '+573226784229'
  website: 'https://arbelaeznicolas.dev/'
  social_networks:
    - network: 'LinkedIn'
      username: 'arbelaeznicolas'
    - network: 'GitHub'
      username: 'nicoarbelaez'
  custom_connections:
    - placeholder: platzi.com/p/arbelaeznicolas636
      url: https://platzi.com/p/arbelaeznicolas636/
      fontawesome_icon: link
  sections:
    perfil:
      - |
        Desarrollador Full Stack especializado en IA generativa aplicada: agentes con LLMs y procesamiento inteligente de documentos que convierte texto e imágenes no estructuradas en información estructurada, trazable y confiable. Experiencia en extracción con modelos de visión (OCR), validación por esquemas y niveles de confianza por campo para revisión humana, sobre backends TypeScript/NestJS. Desarrollo AI-First con agentes de código, testing automatizado y CI/CD.
    experiencia_laboral:
      - company: 'Danys Tortas'
        summary: 'Proyecto - Freelancer (hoy soporte y evolución) | [danystortas.com](https://danystortas.com)'
        position: 'Desarrollador Full Stack – IA Generativa'
        location: 'Colombia'
        start_date: '2026-01'
        end_date: 'present'
        highlights:
          - 'Diseñé un pipeline de procesamiento inteligente de documentos (clasificación, extracción, resolución y validación) que digitaliza pedidos físicos e impresos con modelos de visión (OCR) y salida estructurada validada con JSON Schema y Zod.'
          - 'Implementé nivel de confianza (0–1) por campo y detección de campos de baja confianza para revisión humana, con versionado de prompt y modelo por extracción para trazabilidad y mejora continua.'
          - 'Diseñé y opero un agente de IA de ventas y soporte end-to-end por WhatsApp (Kommo CRM) que atiende a más de 300 clientes diarios: búsqueda semántica de catálogo (pgvector), RAG, pedidos, pagos, domicilios y escalamiento a humano.'
          - 'Construí un pipeline LLM propio de ocho etapas (clasificación de intents, ruteo de modelos por costo vía OpenRouter, loop de herramientas con circuit breakers) con guardrails deterministas que bloquean montos o datos de pago no provenientes de herramientas.'
          - 'Instrumenté trazas, telemetría de costo por ejecución y presupuestos de IA por organización; calidad sostenida con más de 1.400 archivos de pruebas y CI/CD en GitHub Actions.'
          - 'Stack: NestJS, Next.js, TypeScript, PostgreSQL (Prisma, pgvector), Redis/BullMQ, Docker, Dokploy.'

      - company: 'Trainer Elitez'
        summary: 'Proyecto - Freelancer'
        position: 'Desarrollador de Software y Automatización'
        location: 'Colombia'
        start_date: '2024'
        end_date: '2026'
        highlights:
          - 'Automaticé el cálculo de macros nutricionales y rutinas de
            entrenamiento personalizadas, eliminando errores manuales críticos
            del negocio fitness.'
          - 'Centralicé la gestión de clientes en una app móvil propia que
            reemplazó hojas de cálculo dispersas usadas por el equipo.'
          - 'Tecnologías: Google Apps Script, Google AppSheet, TypeScript.'

      - company: 'Banco Davivienda'
        position: 'Aprendiz – Programa Nativos Semillero'
        location: 'Colombia'
        start_date: '2025-03'
        end_date: '2026-03'
        highlights:
          - 'Automaticé procesos de back office con Google Apps Script,
            reduciendo tareas operativas manuales del equipo.'
          - 'Desarrollé tableros de visualización para indicadores de captación
            bancaria consumidos por el área de negocio.'
          - 'Tecnologías: Google Apps Script, JavaScript, Google Sheets API.'

    proyectos:
      - name: 'Smart Work Core'
        summary: '[swc.mecateo.co](https://swc.mecateo.co)'
        date: '2026-10'
        highlights:
          - 'Desarrollé una plataforma de inteligencia empresarial que
            convierte fuentes públicas de Colombia (SECOP II, datos.gov.co,
            Banco Mundial, XM, noticias y regulación) en señales, alertas,
            análisis PESTEL y briefings trazables para la toma de decisiones.'
          - 'Integré un asistente de IA generativa con Vercel AI SDK
            (OpenAI/OpenRouter) que responde solo sobre los datos cargados y
            cita la fuente original, con búsqueda web opcional.'
          - 'Apliqué arquitectura por capas con adaptadores por fuente, pruebas
            con Vitest y Playwright, CI en GitHub Actions y acceso restringido
            con Cloudflare Access.'

      - name: 'Mecateo'
        summary: 'SaaS propio | [mecateo.co](https://mecateo.co)'
        start_date: '2026-05'
        end_date: 'present'
        highlights:
          - 'Construyo con un equipo pequeño un SaaS multi-tenant para negocios
            físicos: soportes NFC/QR con destinos editables, captación de
            contactos y analítica de taps.'
          - 'Diseñé un monorepo Turborepo (12 apps, 10 paquetes) con NestJS,
            Next.js, Prisma sobre PostgreSQL y Better Auth; CI/CD con staging,
            backup y migración previos al despliegue y más de 600 archivos de
            pruebas.'

      - name: 'ReadIA'
        summary: '[readia.arbelaeznicolas.dev](https://readia.arbelaeznicolas.dev)'
        date: 2025
        highlights:
          - 'Construí plataforma serverless con IA generativa para diagnóstico
            de capacidades TI y reportes PDF automáticos (Next.js, Vercel AI
            SDK, Gemini, Supabase, AWS Lambda).'

    habilidades_tecnicas:
      - bullet: 'IA Generativa: LLMs (OpenAI/Gemini/OpenRouter), procesamiento
          inteligente de documentos, OCR con modelos de visión, extracción
          estructurada (JSON Schema, Zod), clasificación de intents (NLP),
          agentes y orquestación de herramientas.'
      - bullet: 'Calidad & DevOps: testing automatizado, CI/CD con GitHub
          Actions, Docker, desarrollo AI-First con agentes de código.'
      - bullet: 'Backend: TypeScript, Node.js, NestJS, Python, Java (Spring Boot),
          PHP.'
      - bullet: 'Frontend: Next.js (React), Astro, Tailwind CSS, TypeScript, React
          Native (Expo).'
      - bullet: 'BD & Infra: PostgreSQL (pgvector), Supabase, Redis, Docker,
          Dokploy, Vercel, AWS Lambda, Cloudflare.'
      - bullet: 'IA & Automatización: Arquitecturas agentic, integración de LLMs
          (OpenRouter/Gemini/OpenAI), procesamiento inteligente de documentos
          (OCR con modelos de visión), n8n, Google Apps Script.'
    certificados:
      - bullet: 'Platzi (Ago 2025) | [Curso de Automatizaciones con
          n8n](https://platzi.com/p/arbelaeznicolas636/curso/12245-n8n-lowcode/diploma/detalle/)'
      - bullet: 'Platzi (Abr 2025) | [Curso de Backend con Node.js: Autenticación con
          Passport.js y
          JWT](https://platzi.com/p/arbelaeznicolas636/curso/2489-passport/diploma/detalle/)'
      - bullet: 'Platzi (Mar 2025) | [Curso de Backend con Node.js: Base de Datos con
          PostgreSQL](https://platzi.com/p/arbelaeznicolas636/curso/2507-backend-nodejs-postgres/diploma/detalle/)'
      - bullet: 'Platzi (Mar 2025) | [Curso de Backend con Node.js: API REST con
          Express.js](https://platzi.com/p/arbelaeznicolas636/curso/2485-backend-nodejs/diploma/detalle/)'
      - bullet: 'Platzi (Nov 2024) | [Curso de Java Spring Security: Autenticación y
          Seguridad
          Web](https://platzi.com/p/arbelaeznicolas636/curso/7694-java-spring-security/diploma/detalle/)'
    educacion:
