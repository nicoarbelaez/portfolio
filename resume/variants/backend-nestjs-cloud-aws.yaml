meta:
  role: Back-end Software Engineer · NestJS / Cloud Native / AWS
  date: 2026-11-26
  context: "Variante backend: NestJS y TypeScript estricto, arquitectura por capas con adaptadores, colas y concurrencia, CI/CD y AWS. Terraform figura como en aprendizaje."
cv:
  headline: "Back-end Software Engineer | NestJS · TypeScript · AWS · CI/CD"
  sections:
    perfil:
      - |
        Desarrollador back-end y Full Stack desde 2022. Construyo servicios con NestJS y TypeScript estricto sobre PostgreSQL (Prisma), con arquitectura por capas y adaptadores, colas y procesamiento asíncrono (Redis/BullMQ), pruebas automatizadas y CI/CD en GitHub Actions. Despliego con Docker y AWS Lambda. Opero backends en producción para un agente de IA de ventas que atiende a más de 300 clientes diarios y un SaaS multi-tenant en monorepo. Estoy incorporando Terraform para infraestructura como código. Flujo AI-first con revisión de cada cambio.
    experiencia_laboral:
      - company: Danys Tortas
        summary: Proyecto - Freelancer (hoy soporte y evolución) | [danystortas.com](https://danystortas.com)
        position: Desarrollador Full Stack – Backend NestJS e IA
        location: Colombia
        start_date: 2026-01
        end_date: present
        highlights:
          - Diseñé y opero un backend NestJS que sostiene un agente de IA de ventas y soporte por WhatsApp (Kommo CRM) para más de 300 clientes diarios, con PostgreSQL (Prisma, pgvector) y Redis/BullMQ.
          - Construí un pipeline LLM propio de ocho etapas con loop de herramientas, circuit breakers, ruteo de modelos por costo y RAG, tras migrar desde LangGraph.
          - Integré el sistema con un ERP multi-sucursal (inventario, caja, despachos, RBAC de seis roles) e implementé guardrails deterministas con telemetría de costo.
          - Instrumenté trazas y presupuestos por organización; más de 1.400 archivos de pruebas y CI/CD en GitHub Actions con despliegue automatizado en Dokploy.
          - "Stack: NestJS, TypeScript, PostgreSQL (Prisma, pgvector), Redis/BullMQ, Docker, Dokploy."
      - company: Trainer Elitez
        summary: Proyecto - Freelancer
        position: Desarrollador de Software y Automatización
        location: Colombia
        start_date: "2024"
        end_date: "2026"
        highlights:
          - Automaticé el cálculo de macros y rutinas de entrenamiento personalizadas, eliminando errores manuales críticos del negocio.
          - Centralicé la gestión de clientes en una app móvil propia que reemplazó hojas de cálculo dispersas.
          - "Tecnologías: Google Apps Script, Google AppSheet, TypeScript."
      - company: Banco Davivienda
        position: Aprendiz – Programa Nativos Semillero
        location: Colombia
        start_date: 2025-03
        end_date: 2026-03
        highlights:
          - Automaticé procesos de back office con Google Apps Script, reduciendo tareas operativas manuales del equipo.
          - Desarrollé tableros de visualización para indicadores de captación bancaria consumidos por el área de negocio.
    proyectos:
      - name: Mecateo
        summary: SaaS propio | [mecateo.co](https://mecateo.co)
        start_date: 2026-05
        end_date: present
        highlights:
          - Diseñé un monorepo Turborepo (12 apps, 10 paquetes) con NestJS, Next.js, Prisma sobre PostgreSQL, Better Auth y Socket.IO para un SaaS multi-tenant.
          - "Automaticé CI/CD con GitHub Actions: staging, backup y migración previos al despliegue en Dokploy, y más de 600 archivos de pruebas."
      - name: Smart Work Core
        summary: "[swc.mecateo.co](https://swc.mecateo.co)"
        date: 2026-10
        highlights:
          - Apliqué arquitectura por capas con adaptadores por fuente para consolidar datos públicos de Colombia (SECOP II, datos.gov.co, Banco Mundial, XM) en señales, alertas y briefings.
          - Pruebas con Vitest y Playwright, CI en GitHub Actions y acceso restringido con Cloudflare Access.
      - name: ReadIA
        summary: "[readia.arbelaeznicolas.dev](https://readia.arbelaeznicolas.dev)"
        date: 2025
        highlights:
          - Construí plataforma serverless con IA sobre AWS Lambda para lógica de backend desacoplada, con Supabase como persistencia, desplegada en Vercel.
    habilidades_tecnicas:
      - bullet: "Backend: NestJS, TypeScript estricto, Node.js, Prisma, APIs REST, colas con Redis/BullMQ, Python, Java (Spring Boot)."
      - bullet: "Cloud & Infra: AWS Lambda, Docker, Dokploy, Vercel, Cloudflare; en aprendizaje: Terraform (infraestructura como código)."
      - bullet: "Calidad & DevOps: GitHub Actions (CI/CD), Vitest/Jest, Playwright/Cypress, Git flow con pull requests, ESLint."
      - bullet: "BD: PostgreSQL (pgvector), Supabase, Redis; modelado relacional con Prisma."
      - bullet: "IA & Automatización: agentes con loop de herramientas, RAG, integración de LLMs, n8n, Google Apps Script."
      - bullet: "Frontend: Next.js (React), Astro, Tailwind CSS."
