meta:
  role: AI Engineer · Procesamiento inteligente de documentos
  date: 2026-11-14
  context: "Variante centrada en IA generativa aplicada: OCR con modelos de visión, extracción de entidades con validación por esquemas y niveles de confianza por campo."
cv:
  headline: null
  sections:
    perfil:
      - |
        Desarrollador de software desde 2022, enfocado en IA generativa aplicada (OpenAI y otros LLMs) y procesamiento inteligente de documentos: convierto documentos físicos e impresos y texto no estructurado en información estructurada, confiable y accionable. Experiencia en OCR con modelos de visión, extracción de entidades con validación por esquemas, niveles de confianza por campo y evaluación iterativa con revisión humana, sobre backends TypeScript/NestJS. AI-First con agentes de código.
    experiencia_laboral:
      - company: Danys Tortas
        summary: Proyecto - Freelancer (hoy soporte y evolución) | [danystortas.com](https://danystortas.com)
        position: Desarrollador Full Stack – IA Generativa
        location: Colombia
        start_date: 2026-01
        end_date: present
        highlights:
          - Diseñé un pipeline de procesamiento inteligente de documentos (clasificación, extracción de entidades, resolución y validación) que digitaliza pedidos físicos e impresos con modelos de visión (OCR) y salida estructurada validada con JSON Schema y Zod.
          - Implementé nivel de confianza (0–1) por campo para clasificar y priorizar la revisión humana de los campos de baja confianza; ajusté prompts y umbrales de forma iterativa según los errores observados, con versionado de prompt y modelo por extracción para trazabilidad y mejora continua.
          - "Diseñé y opero un agente de IA de ventas y soporte end-to-end por WhatsApp (Kommo CRM) que atiende a más de 300 clientes diarios: búsqueda semántica de catálogo (pgvector), RAG, pedidos, pagos, domicilios y escalamiento a humano."
          - Construí un pipeline LLM de ocho etapas (clasificación de intents, ruteo de modelos por costo vía OpenRouter, loop de herramientas) con guardrails deterministas que bloquean montos o datos de pago no provenientes de herramientas.
          - Instrumenté trazas, costo por ejecución y presupuestos de IA por organización; más de 1.400 archivos de pruebas y CI/CD en GitHub Actions.
          - "Stack: NestJS, Next.js, TypeScript, PostgreSQL (Prisma, pgvector), Redis/BullMQ, Docker, Dokploy."
      - company: Trainer Elitez
        summary: Proyecto - Freelancer
        position: Desarrollador de Software y Automatización
        location: Colombia
        start_date: "2024"
        end_date: "2026"
        highlights:
          - Automaticé el cálculo de macros y rutinas de entrenamiento personalizadas y centralicé la gestión de clientes en una app móvil propia que reemplazó hojas de cálculo.
          - "Tecnologías: Google Apps Script, Google AppSheet, TypeScript."
      - company: Banco Davivienda
        position: Aprendiz – Programa Nativos Semillero
        location: Colombia
        start_date: 2025-03
        end_date: 2026-03
        highlights:
          - Automaticé procesos de back office con Google Apps Script y desarrollé tableros de indicadores de captación bancaria para el área de negocio.
          - "Tecnologías: Google Apps Script, JavaScript, Google Sheets API."
      - company: Proyectos independientes y académicos
        position: Desarrollador de Software
        location: Colombia
        start_date: "2022"
        end_date: "2023"
        highlights:
          - Desarrollé un bot de Discord, un plugin en Java de calendario mensual de recompensas diarias para servidores de juego y una aplicación en Python.
          - "Tecnologías: JavaScript, Java, Python, HTML."
    proyectos:
      - name: Smart Work Core
        summary: "[swc.mecateo.co](https://swc.mecateo.co)"
        date: 2026-10
        highlights:
          - Desarrollé una plataforma de inteligencia empresarial que convierte fuentes públicas de Colombia (SECOP II, datos.gov.co, Banco Mundial, XM, noticias y regulación) en señales, alertas, análisis PESTEL y briefings trazables para la toma de decisiones.
          - Integré un asistente de IA generativa con Vercel AI SDK (OpenAI/OpenRouter) que responde solo sobre los datos cargados y cita la fuente original, con búsqueda web opcional.
          - Apliqué arquitectura por capas con adaptadores por fuente, pruebas con Vitest y Playwright y CI en GitHub Actions.
      - name: Mecateo
        summary: SaaS propio | [mecateo.co](https://mecateo.co)
        start_date: 2026-05
        end_date: present
        highlights:
          - Construyo con un equipo pequeño un SaaS multi-tenant para negocios físicos (soportes NFC/QR, captación de contactos, analítica) sobre un monorepo Turborepo con NestJS, Next.js, Prisma/PostgreSQL y Better Auth. CI/CD con staging y más de 600 archivos de pruebas.
      - name: ReadIA
        summary: "[readia.arbelaeznicolas.dev](https://readia.arbelaeznicolas.dev)"
        date: 2025
        highlights:
          - Construí plataforma serverless con IA generativa para diagnóstico de capacidades TI y reportes PDF automáticos (Next.js, Vercel AI SDK, Gemini, Supabase, AWS Lambda).
    habilidades_técnicas:
      - bullet: "IA generativa: LLMs (OpenAI/Gemini/OpenRouter), prompt engineering, procesamiento inteligente de documentos, OCR con modelos de visión, extracción de entidades y datos estructurados (JSON Schema, Zod), NLP (clasificación de intents), niveles de confianza por campo, human-in-the-loop (revisión humana de campos de baja confianza), evaluación iterativa, trazabilidad, agentes y orquestación de herramientas."
      - bullet: "Calidad & DevOps: testing automatizado, CI/CD con GitHub Actions, Docker, desarrollo AI-First con agentes de código."
      - bullet: "Backend: TypeScript, Node.js, NestJS, Python, Java (Spring Boot), PHP."
      - bullet: "Frontend: Next.js (React), Astro, Tailwind CSS, TypeScript, React Native (Expo)."
      - bullet: "BD & Infra: PostgreSQL (pgvector), Supabase, Redis, Docker, Dokploy, Vercel, AWS Lambda, Cloudflare."
      - bullet: "Automatización: arquitecturas agentic, n8n, Google Apps Script."
