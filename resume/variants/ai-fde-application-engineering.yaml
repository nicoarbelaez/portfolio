meta:
  role: Junior Forward Deployed AI Engineer · Application Engineering
  date: 2026-11-26
  context: "Variante para roles de ingeniería de aplicaciones de IA (agentes en producción, orquestación de herramientas, RAG, guardrails) con trabajo directo sobre sistemas y procesos del cliente."
cv:
  headline: "AI Engineer | Agentes de IA en producción | TypeScript · Node.js · React · Python"
  sections:
    perfil:
      - |
        Ingeniero de aplicaciones de IA y desarrollador Full Stack desde 2022. Llevo agentes de IA a producción dentro de procesos reales de negocio: levanto el requerimiento, lo convierto en especificación, diseño la orquestación (loop de herramientas, RAG, guardrails deterministas), lo construyo y lo opero con trazas, costos y pruebas. Opero un agente de ventas y soporte por WhatsApp que atiende a más de 300 clientes diarios e integré procesamiento de documentos con OCR y confianza por campo. Stack en TypeScript, Node.js/NestJS, React/Next.js y Python; trabajo con autonomía frente a requerimientos ambiguos y flujo AI-first con revisión de cada cambio.
    experiencia_laboral:
      - company: Danys Tortas
        summary: Proyecto - Freelancer (hoy soporte y evolución) | [danystortas.com](https://danystortas.com)
        position: Forward Deployed AI Engineer – Agentes de IA
        location: Colombia
        start_date: 2026-01
        end_date: present
        highlights:
          - Diseñé y opero un agente de IA de ventas y soporte end-to-end por WhatsApp (Kommo CRM) que atiende a más de 300 clientes diarios, con búsqueda semántica de catálogo (pgvector), RAG, pedidos, pagos, domicilios y escalamiento a humano.
          - Construí un pipeline LLM propio de ocho etapas (clasificación de intents, ruteo de modelos por costo vía OpenRouter, loop de herramientas con circuit breakers y RAG).
          - Implementé guardrails deterministas que bloquean montos o datos de pago no provenientes de herramientas, con trazas, costo por ejecución y presupuestos de IA por organización.
          - Integré el agente con un ERP multi-sucursal (inventario, caja, despachos, RBAC de seis roles) y un módulo de procesamiento de documentos con OCR y confianza por campo.
          - Desarrollado con flujo AI-first (Claude Code, Cursor) y revisión propia de cada cambio; más de 1.400 archivos de pruebas y CI/CD en GitHub Actions con despliegue automatizado en Dokploy.
      - company: Trainer Elitez
        summary: Proyecto - Freelancer
        position: Desarrollador de Software y Automatización
        location: Colombia
        start_date: "2024"
        end_date: "2026"
        highlights:
          - Automaticé el cálculo de macros y rutinas de entrenamiento personalizadas, eliminando errores manuales críticos del negocio.
          - Centralicé la gestión de clientes en una app móvil propia que reemplazó hojas de cálculo dispersas.
          - "Tecnologías: Google Apps Script, Google AppSheet, TypeScript."
      - company: Banco Davivienda
        position: Aprendiz – Programa Nativos Semillero
        location: Colombia
        start_date: 2025-03
        end_date: 2026-03
        highlights:
          - Automaticé procesos de back office con Google Apps Script, reduciendo tareas operativas manuales del equipo.
          - Desarrollé tableros de visualización para indicadores de captación bancaria consumidos por el área de negocio.
    proyectos:
      - name: Smart Work Core
        summary: "[swc.mecateo.co](https://swc.mecateo.co)"
        date: 2026-10
        highlights:
          - Desarrollé una plataforma de inteligencia empresarial que consolida fuentes públicas de Colombia (SECOP II, datos.gov.co, Banco Mundial, XM) en señales, alertas y briefings para la toma de decisiones.
          - Integré un asistente de IA con Vercel AI SDK (OpenAI/OpenRouter) que responde sobre los datos cargados citando fuentes, con búsqueda web opcional.
          - Apliqué arquitectura por capas, pruebas con Vitest y Playwright, CI en GitHub Actions y acceso restringido con Cloudflare Access.
      - name: ReadIA
        summary: "[readia.arbelaeznicolas.dev](https://readia.arbelaeznicolas.dev)"
        date: 2025
        highlights:
          - Construí plataforma serverless con IA para diagnóstico de capacidades TI con Google Gemini sobre arquitectura sin servidor.
          - Integré Supabase como capa de persistencia y AWS Lambda para lógica de backend desacoplada, desplegada en Vercel.
      - name: Mecateo
        summary: SaaS propio | [mecateo.co](https://mecateo.co)
        start_date: 2026-05
        end_date: present
        highlights:
          - Construyo con un equipo pequeño un SaaS multi-tenant para negocios físicos sobre un monorepo Turborepo con NestJS, Next.js, Prisma/PostgreSQL y Better Auth; CI/CD con staging y más de 600 archivos de pruebas.
    habilidades_tecnicas:
      - bullet: "IA & Agentes: arquitecturas agentic, orquestación de herramientas, RAG, guardrails, integración de LLMs (OpenRouter/Gemini/OpenAI), procesamiento inteligente de documentos (OCR con modelos de visión), human-in-the-loop, trazabilidad y costos de IA."
      - bullet: "Backend: TypeScript, Node.js, NestJS, Python, Java (Spring Boot), APIs REST."
      - bullet: "Frontend: React, Next.js, Astro, Tailwind CSS, React Native (Expo)."
      - bullet: "BD & Infra: PostgreSQL (pgvector), Supabase, Redis, AWS Lambda, Docker, Dokploy, Vercel, Cloudflare."
      - bullet: "Calidad & DevOps: Vitest/Jest, Playwright/Cypress, GitHub Actions (CI/CD), Git flow con pull requests; desarrollo AI-first (Claude Code, Cursor Agent, Codex, Gemini CLI)."
