meta:
  role: Semi-Senior Full-stack Engineer · APIs, AWS y desarrollo asistido por IA
  date: 2026-11-26
  context: "Variante para rol .NET/C#: se vende desarrollo de APIs REST, AWS, migraciones y flujo AI-assisted; C#/.NET se declara como en aprendizaje (sin experiencia profesional en ese stack)."
cv:
  headline: "Full Stack Engineer | APIs REST · AWS · Desarrollo asistido por IA | Aprendiendo C#/.NET"
  sections:
    perfil:
      - |
        Desarrollador Full Stack desde 2022 con foco en APIs REST (autenticación, versionado y manejo de errores), AWS y desarrollo asistido por IA, con revisión de cada cambio y pruebas automatizadas. Migré un pipeline LLM desde LangGraph a una implementación propia y reemplacé hojas de cálculo dispersas por una app propia. Experiencia en producción con TypeScript/NestJS, Next.js, PostgreSQL y Java (Spring Boot). Estoy aprendiendo C#/.NET activamente y no tengo experiencia profesional previa en ese stack.
    experiencia_laboral:
      - company: Danys Tortas
        summary: Proyecto - Freelancer (hoy soporte y evolución) | [danystortas.com](https://danystortas.com)
        position: Desarrollador Full Stack – Agentes de IA
        location: Colombia
        start_date: 2026-01
        end_date: present
        highlights:
          - Construí un pipeline LLM propio de ocho etapas (clasificación de intents, ruteo de modelos por costo, loop de herramientas con circuit breakers y RAG), tras migrar desde LangGraph.
          - Diseñé y opero un agente de IA de ventas y soporte por WhatsApp (Kommo CRM) que atiende a más de 300 clientes diarios, con integración a un ERP multi-sucursal (inventario, caja, despachos, RBAC de seis roles).
          - Desarrollado con flujo AI-first (Claude Code, Cursor) y revisión propia de cada cambio; más de 1.400 archivos de pruebas y CI/CD en GitHub Actions con despliegue automatizado en Dokploy.
      - company: Trainer Elitez
        summary: Proyecto - Freelancer
        position: Desarrollador de Software y Automatización
        location: Colombia
        start_date: "2024"
        end_date: "2026"
        highlights:
          - Centralicé la gestión de clientes en una app móvil propia que reemplazó hojas de cálculo dispersas.
          - Automaticé el cálculo de macros y rutinas de entrenamiento personalizadas, eliminando errores manuales críticos del negocio.
          - "Tecnologías: Google Apps Script, Google AppSheet, TypeScript."
      - company: Banco Davivienda
        position: Aprendiz – Programa Nativos Semillero
        location: Colombia
        start_date: 2025-03
        end_date: 2026-03
        highlights:
          - Automaticé procesos de back office con Google Apps Script, reduciendo tareas operativas manuales del equipo.
          - Desarrollé tableros de visualización para indicadores de captación bancaria consumidos por el área de negocio.
    proyectos:
      - name: ReadIA
        summary: "[readia.arbelaeznicolas.dev](https://readia.arbelaeznicolas.dev)"
        date: 2025
        highlights:
          - Construí plataforma serverless para diagnóstico de capacidades TI con Google Gemini sobre AWS Lambda para lógica de backend desacoplada, con Supabase y despliegue en Vercel.
      - name: Mecateo
        summary: SaaS propio | [mecateo.co](https://mecateo.co)
        start_date: 2026-05
        end_date: present
        highlights:
          - Construyo con un equipo pequeño un SaaS multi-tenant sobre monorepo Turborepo con NestJS, Next.js, Prisma/PostgreSQL y Better Auth (autenticación y roles); CI/CD con staging y más de 600 archivos de pruebas.
      - name: Smart Work Core
        summary: "[swc.mecateo.co](https://swc.mecateo.co)"
        date: 2026-10
        highlights:
          - Consolidé fuentes públicas de Colombia (SECOP II, datos.gov.co, Banco Mundial, XM) mediante integraciones por API y arquitectura por capas, con pruebas Vitest/Playwright y CI en GitHub Actions.
    habilidades_tecnicas:
      - bullet: "Backend & APIs: APIs REST (autenticación, versionado, manejo de errores), TypeScript, Node.js, NestJS, Java (Spring Boot), Python; en aprendizaje: C#/.NET."
      - bullet: "Cloud: AWS Lambda, Docker, Dokploy, Vercel, Cloudflare."
      - bullet: "Desarrollo asistido por IA: Claude Code, Cursor Agent, GitHub Copilot/Codex, Gemini CLI; desarrollo guiado por especificaciones y revisión de código generado."
      - bullet: "Calidad & DevOps: GitHub Actions (CI/CD), Vitest/Jest, Playwright/Cypress, Git flow con pull requests."
      - bullet: "BD: PostgreSQL (pgvector), Supabase, Redis."
      - bullet: "Frontend: Next.js (React), Tailwind CSS."
